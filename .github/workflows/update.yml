name: Update
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - id: list
        run: echo "packages=$(nix eval --json .#packages.aarch64-darwin --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: oschrenk
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: update
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          args=$(nix eval --raw ".#$PACKAGE" --apply 'p: toString (p.nixUpdateArgs or [ ])')
          nix run nixpkgs#nix-update -- --flake --build $args "$PACKAGE"
          echo "version=$(nix eval --raw ".#$PACKAGE.version")" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "${{ matrix.package }}: ${{ steps.update.outputs.version }}"
          title: "${{ matrix.package }}: ${{ steps.update.outputs.version }}"
          branch: update/${{ matrix.package }}
          delete-branch: true
